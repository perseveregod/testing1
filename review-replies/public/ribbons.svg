<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Each ribbon is a satin band: dark edge, bright crease, dark edge. -->
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a8a"/><stop offset=".28" stop-color="#2a7bff"/><stop offset=".48" stop-color="#bfe2ff"/><stop offset=".6" stop-color="#5fb0ff"/><stop offset="1" stop-color="#071d66"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061a5c"/><stop offset=".35" stop-color="#1e5fe0"/><stop offset=".55" stop-color="#9fd3ff"/><stop offset=".7" stop-color="#2f7cf0"/><stop offset="1" stop-color="#051546"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2f8f"/><stop offset=".4" stop-color="#4aa3ff"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".62" stop-color="#6fb8ff"/><stop offset="1" stop-color="#0a2a7a"/>
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05123d"/><stop offset=".45" stop-color="#1b4fc4"/><stop offset=".58" stop-color="#7cc3ff"/><stop offset="1" stop-color="#040d2e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe7fb"/><stop offset=".5" stop-color="#9dbdf2"/><stop offset="1" stop-color="#2d5fc9"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- distant soft band for depth -->
  <path d="M-200 760 C 300 560, 700 980, 1200 640 S 1800 420, 1900 520 L 1900 1100 L -200 1100 Z" fill="#1748b8" opacity=".55" filter="url(#haze)"/>
  <!-- ribbon 4: far back -->
  <path d="M-100 300 C 250 120, 520 520, 900 360 S 1450 40, 1750 220 L 1750 420 C 1450 240, 1200 430, 900 560 S 300 420, -100 520 Z" fill="url(#r4)" filter="url(#soft)"/>
  <!-- ribbon 2 -->
  <path d="M-100 640 C 300 380, 620 760, 980 520 S 1500 220, 1750 380 L 1750 560 C 1500 420, 1250 560, 980 700 S 350 620, -100 820 Z" fill="url(#r2)" filter="url(#soft)"/>
  <!-- ribbon 1: main -->
  <path d="M-100 460 C 320 240, 560 640, 940 440 S 1420 150, 1750 300 L 1750 470 C 1450 330, 1200 520, 940 620 S 400 520, -100 660 Z" fill="url(#r1)" filter="url(#soft)"/>
  <!-- ribbon 3: thin bright fold in front -->
  <path d="M-100 560 C 330 420, 600 700, 980 560 S 1480 330, 1750 440 L 1750 500 C 1480 400, 1250 620, 980 640 S 380 520, -100 640 Z" fill="url(#r3)" filter="url(#soft)"/>
  <!-- specular streaks -->
  <path d="M60 540 C 380 400, 640 650, 960 560" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M700 470 C 1000 380, 1250 300, 1600 330" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
