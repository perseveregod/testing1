name: ReplyDesk keep-alive

# Render's free plan puts the site to sleep after about 15 minutes without a
# visitor, and the next person then waits 20-30 seconds on Render's
# "Application loading" screen. This loads the home page every 10 minutes so
# the site stays awake for people arriving from an ad or an email.
#
# Optional repository secret:
#   REPLYDESK_URL  overrides the site URL below (set it when the domain changes)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: replydesk-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Load the home page
        env:
          REPLYDESK_URL: ${{ secrets.REPLYDESK_URL || 'https://replydesk-vyx6.onrender.com' }}
        run: |
          # A sleeping site answers with Render's loading page first, so retry
          # until the real page (which names ReplyDesk in its title) comes back.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 60 "$REPLYDESK_URL/" || echo 000)
            if [ "$status" = "200" ] && grep -q "<title>ReplyDesk" /tmp/home.html; then
              echo "awake: HTTP $status on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status, not the real page yet"
            sleep 15
          done
          echo "ReplyDesk did not come up after 6 attempts"
          exit 1
